[package]
name = "waveshare-watch-rs"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
log = "0.4"

# Embassy async runtime
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2.1"

# Graphics
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6"

# HAL traits
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embedded-storage = "0.3"

# WiFi / Networking
embassy-net = { version = "0.9.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
    "dns",
] }

# Peripheral drivers
axp2101-embedded = "0.3"
embedded-sdmmc = "0.8"
embedded-io = "0.6"
embedded-io-async = "0.6"

# MP3 decoding
nanomp3 = "0.1"

# QR Code (no_std, no alloc — generates QR matrix directly)
embedded-qr = "0.2"
# Networking & Storage
edge-dhcp = { version = "0.8.0", default-features = false }
libm = "0.2"
hmac = { version = "0.12.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true

[lib]
name = "waveshare_watch_rs"
path = "src/lib.rs"

[features]
default = []
firmware = []
smart-home = []

[[bin]]
name = "waveshare-watch-rs"
path = "src/main.rs"
required-features = ["firmware"]

[target.'cfg(target_arch = "xtensa")'.dependencies]
# ESP HAL + Runtime
esp-hal = { version = "1.1.0-rc.0", default-features = true, features = [
    "esp32s3",
    "unstable",
] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio"] }
bt-hci = "0.8.1"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
esp-radio = { version = "0.18.0", features = [
    "esp32s3",
    "wifi",
    "ble",
    "unstable",
    "log-04",
] }
trouble-host = { version = "0.6.0", default-features = false, features = [
    "peripheral",
    "gatt",
    "derive",
    "default-packet-pool",
] }
esp-storage = { version = "0.6.0", features = ["esp32s3"] }
